display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/html/private/logs/php-error.log
expose_php = Off
; GD decodes uploaded images into uncompressed RGBA buffers, so large uploads
; (up to 100M) need substantial memory headroom.
memory_limit = 1024M
upload_tmp_dir = /var/www/html/private/upload/tmp
upload_max_filesize = 100M
post_max_size = 101M
max_execution_time = 60
