name: smolcms

services:
  dev:
    image: smolcms:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: smolcms-dev
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMOLCMS_DEV_PORT:-8080}:8080"
    user: "10001:10001"
    group_add:
      - "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # 10 concurrent 100 MiB upload bodies plus FastCGI/proxy/SCGI temp-file headroom.
      - /tmp:rw,nosuid,nodev,noexec,size=2g,mode=1777
    volumes:
      - type: bind
        source: "${HOME:?HOME must be set}/SmolCms/db"
        target: /var/www/html/private/db
        bind:
          create_host_path: true
      - type: bind
        source: "${HOME:?HOME must be set}/SmolCms/upload"
        target: /var/www/html/private/upload
        bind:
          create_host_path: true
      - type: bind
        source: "${HOME:?HOME must be set}/SmolCms/img"
        target: /var/www/html/private/img
        bind:
          create_host_path: true
      - type: bind
        source: "${HOME:?HOME must be set}/SmolCms/public-img"
        target: /var/www/html/public/img
        bind:
          create_host_path: true
      - type: bind
        source: "${HOME:?HOME must be set}/SmolCms/logs"
        target: /var/www/html/private/logs
        bind:
          create_host_path: true
