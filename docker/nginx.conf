worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/www/html/private/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/www/html/private/logs/nginx-access.log combined;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    server {
        listen 8080;
        server_name localhost;
        root /var/www/html;
        autoindex off;

        location = /private {
            return 403;
        }

        location ^~ /private/ {
            return 403;
        }

        # Internal-only image locations: reachable only through X-Accel-Redirect
        # from the PHP backend (see ImageFileController). Direct client requests
        # get a 404 because the locations are marked internal.
        location ^~ /internal/img/sample/ {
            internal;
            alias /var/www/html/private/img/sample/;
        }

        location ^~ /internal/img/dl/ {
            internal;
            alias /var/www/html/private/img/dl/;
        }

        location ^~ /public/ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
        }

        location ~ \.php(?:/|$) {
            return 404;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/src/app.php;
            fastcgi_param SCRIPT_NAME /src/app.php;
            fastcgi_param DOCUMENT_ROOT $document_root;
        }
    }
}
