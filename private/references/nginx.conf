user http;
worker_processes  1;

error_log  /var/log/nginx/error.log;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;
    root           /usr/share/nginx/html;

    sendfile        on;

    keepalive_timeout  65;


    server {
        listen       80;
        server_name  localhost;

        # serve static files from /public as-is, cache for 1 hour
        location /public/ {
                root /usr/share/nginx/html;
                try_files $uri =404;
                expires 1h;
                add_header Cache-Control "public";
        }

        # block all access to /private/
        location /private/ {
                deny all;
                return 403;
        }

        # pass everything else to the single php script
        location / {
                include fastcgi_params;
                fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root/src/app.php;
        }
    }
}
