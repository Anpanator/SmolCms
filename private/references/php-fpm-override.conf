# systemd drop-in for php-fpm to make the deployed application's writable
# directories writable again under ProtectSystem=full.
#
# ProtectSystem=full (see `systemctl cat php-fpm`) mounts /usr (among others)
# read-only for the service. The application is deployed under
# /usr/share/nginx/html, so its SQLite database and image storage would become
# read-only: reads succeed, but every write (user registration, session
# persistence, image upload) fails and surfaces as a 500 response.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/php-fpm.service.d
#   sudo cp private/references/php-fpm-override.conf /etc/systemd/system/php-fpm.service.d/smolcms.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart php-fpm
#
# The listed paths must exist when php-fpm starts.

[Service]
ReadWritePaths=/usr/share/nginx/html/private/db /usr/share/nginx/html/private/upload/img
